name: Repo Dispatcher

on:
  workflow_dispatch:
    inputs:
      device:
        description: '选择编译机型'
        type: choice
        options:
          - ax6000
          - cudy_tr3000
        default: ax6000
        required: true
      param:
        description: '可选参数，例如 ssh、nocache'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger selected device
        env:
          REPO_TOKEN: ${{ secrets.TOKEN_KIDDIN9 || github.token }}
          BUILD_DEVICE: ${{ inputs.device }}
          BUILD_PARAM: ${{ inputs.param }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY' > dispatch.json
          import json, os, sys
          device = os.environ['BUILD_DEVICE']
          if device not in ('ax6000', 'cudy_tr3000'):
              raise SystemExit('Unsupported device')
          json.dump({
              'event_type': f"{device} {os.environ['BUILD_PARAM']}".strip(),
              'client_payload': {'target': 'mediatek_filogic', 'device': device},
          }, sys.stdout)
          PY
          curl --fail-with-body -sS -X POST \
            "https://api.github.com/repos/$REPOSITORY/dispatches" \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $REPO_TOKEN" \
            --data-binary @dispatch.json
